[package]
name = "snout-storage"
description = "snout-storage: file storage for Postgres-backed apps, over S3, with row-level security deciding access."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snoutdata/snout-storage"
rust-version = "1.98.1"
publish = false

[[bin]]
name = "snout-storage"
path = "src/main.rs"

[dependencies]
# The server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util", "process", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tower = { version = "0.5", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
multer = "3"

# Postgres: the customer's own database (every object operation runs there, as the caller) and
# the metadata database that holds the tenants.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-time-0_3"] }
deadpool-postgres = "0.14"

# S3, signed here (sigv4.rs) rather than through the AWS SDK: eight calls, no C build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# The tenant rows' at-rest encryption (CryptoJS-compatible, crypto.rs). Tokens are jwt.rs.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
percent-encoding = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }


# Written out from the stack's workspace, which this crate is published from.
[lints.rust]
# X13: no `unsafe` outside the pgrx boundary. The three extensions under ext/ opt out in
# their own Cargo.toml when pgrx arrives, and nowhere else may.
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# For iterating on a build host: release speed without fat LTO's link time. Numbers that are
# reported (sizes, the bench) come from `release`, never from this.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

# Its own workspace: this repository is not part of any other.
[workspace]
